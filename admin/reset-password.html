
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#101010">
  <title>Reset Password | Ronie Arnold</title>
  <link rel="stylesheet" href="../css/style.css">

  <style>
    body {
      min-height: 100vh;
      background: #101010;
    }

    .reset-wrap {
      width: min(480px, 92%);
      margin: 70px auto;
    }

    .reset-panel {
      background: #222;
      border: 1px solid #ffffff20;
      padding: 28px;
      margin-top: 25px;
    }

    .reset-form {
      display: grid;
      gap: 14px;
    }

    .reset-form label {
      color: #d9a45b;
      font-size: 14px;
    }

    .reset-form input {
      width: 100%;
      padding: 13px;
      color: #f0efea;
      background: #101010;
      border: 1px solid #ffffff30;
      font: inherit;
    }

    .reset-form button {
      padding: 12px 20px;
      border: 1px solid #d9a45b;
      background: #d9a45b;
      color: #101010;
      font-weight: bold;
      cursor: pointer;
    }

    .reset-form button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .reset-status {
      color: #d9a45b;
      margin-top: 15px;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="reset-wrap">
    <p class="eyebrow">RONIE ARNOLD · PORTFOLIO</p>
    <h1>Reset password</h1>
    <p class="intro">Choose a new password for your admin account.</p>

    <section class="reset-panel">
      <form id="reset-form" class="reset-form hidden">
        <label for="new-password">New password</label>
        <input
          id="new-password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <label for="confirm-password">Confirm new password</label>
        <input
          id="confirm-password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button id="reset-button" type="submit">
          Update password
        </button>
      </form>

      <p id="reset-status" class="reset-status" aria-live="polite">
        Verifying your recovery link...
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const client = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
      );

      const form = document.getElementById("reset-form");
      const status = document.getElementById("reset-status");
      const button = document.getElementById("reset-button");

      function showStatus(message) {
        status.textContent = message;
      }

      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(
        window.location.hash.substring(1)
      );

      const recoveryError =
        params.get("error_description") ||
        hashParams.get("error_description");

      if (recoveryError) {
        showStatus(decodeURIComponent(recoveryError.replace(/\+/g, " ")));
        return;
      }

      const { data, error } = await client.auth.getSession();

      if (error || !data.session) {
        showStatus(
          "This recovery link is invalid or has expired. Request a new password reset email."
        );
        return;
      }

      form.classList.remove("hidden");
      showStatus("Enter and confirm your new password.");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const password = document.getElementById("new-password").value;
        const confirmation = document.getElementById("confirm-password").value;

        if (password.length < 8) {
          showStatus("Your password must be at least 8 characters long.");
          return;
        }

        if (password !== confirmation) {
          showStatus("The passwords do not match.");
          return;
        }

        button.disabled = true;
        showStatus("Updating your password...");

        const { error: updateError } = await client.auth.updateUser({
          password: password
        });

        if (updateError) {
          showStatus(updateError.message);
          button.disabled = false;
          return;
        }

        await client.auth.signOut();

        showStatus("Your password has been updated. Redirecting to sign in...");

        setTimeout(() => {
          window.location.href = "./";
        }, 2000);
      });
    });
  </script>
</body>
</html>
