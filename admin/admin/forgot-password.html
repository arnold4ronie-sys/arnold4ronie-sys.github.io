
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#101010">
  <title>Forgot Password | Ronie Arnold</title>
  <link rel="stylesheet" href="../css/style.css">

  <style>
    body {
      min-height: 100vh;
      background: #101010;
    }

    .recovery-wrap {
      width: min(480px, 92%);
      margin: 70px auto;
    }

    .recovery-panel {
      background: #222;
      border: 1px solid #ffffff20;
      padding: 28px;
      margin-top: 25px;
    }

    .recovery-form {
      display: grid;
      gap: 14px;
    }

    .recovery-form label {
      color: #d9a45b;
      font-size: 14px;
    }

    .recovery-form input {
      width: 100%;
      padding: 13px;
      color: #f0efea;
      background: #101010;
      border: 1px solid #ffffff30;
      font: inherit;
    }

    .recovery-form button {
      padding: 12px 20px;
      border: 1px solid #d9a45b;
      background: #d9a45b;
      color: #101010;
      font-weight: bold;
      cursor: pointer;
    }

    .recovery-form button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .recovery-status {
      color: #d9a45b;
      margin-top: 15px;
      overflow-wrap: anywhere;
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: #d9a45b;
    }
  </style>
</head>

<body>
  <main class="recovery-wrap">
    <p class="eyebrow">RONIE ARNOLD · PORTFOLIO</p>
    <h1>Forgot password?</h1>
    <p class="intro">Request a secure password-reset link for your admin account.</p>

    <section class="recovery-panel">
      <form id="recovery-form" class="recovery-form">
        <label for="email">Account email address</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          required
        >

        <button id="send-button" type="submit">
          Send reset link
        </button>
      </form>

      <p id="recovery-status" class="recovery-status" aria-live="polite"></p>

      <a class="back-link" href="./">Back to admin sign in</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const client = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
      );

      const form = document.getElementById("recovery-form");
      const emailInput = document.getElementById("email");
      const button = document.getElementById("send-button");
      const status = document.getElementById("recovery-status");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        button.disabled = true;
        status.textContent = "Sending recovery email...";

        const email = emailInput.value.trim();

        const { error } = await client.auth.resetPasswordForEmail(email, {
          redirectTo:
            "https://arnold4ronie-sys.github.io/admin/reset-password.html"
        });

        if (error) {
          status.textContent = error.message;
          button.disabled = false;
          return;
        }

        status.textContent =
          "If an account exists for that email, a password-reset link will be sent. Check your inbox.";
        button.disabled = false;
      });
    });
  </script>
</body>
</html>
